[project]
name = "utilities-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ILYASSE", email = "ilyasyou03@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "highspy>=1.15.1",
    "pandas>=3.1.0",
    "pyomo>=6.10.1",
]

[project.scripts]
utilities-optimizer = "utilities_optimizer:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]
